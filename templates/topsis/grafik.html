{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="bg-white shadow-lg rounded-lg p-6">
  <div class="flex justify-between space-x-2 mb-4">
    <h2 class="text-2xl font-bold text-yellow-700">GRAFIK HASIL TINGKAT URGENSI</h2>
  </div>

  <!-- ERROR MESSAGE (jika ada) -->
  {% if error %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <strong>Error:</strong> {{ error }}
  </div>
  {% endif %}

  <!-- ACCORDION CONTAINER -->
  <div class="space-y-4">
    
    <!-- ========================================== -->
    <!-- ACCORDION 1: PRIORITAS SURAT BERDASARKAN RANKING -->
    <!-- ========================================== -->
    <div class="border border-gray-300 rounded-lg overflow-hidden">
      <!-- HEADER ACCORDION 1 -->
      <button 
        onclick="toggleAccordion('accordion-1')" 
        class="w-full px-4 py-3 bg-gray-100 hover:bg-gray-200 flex justify-between items-center font-semibold text-gray-800 transition"
      >
        <span>Secara Ranking</span>
        <span id="arrow-1" class="transition transform duration-300">›</span>
      </button>
      
      <!-- CONTENT ACCORDION 1 -->
      <div 
        id="accordion-1" 
        class="hidden bg-white p-4 overflow-hidden transition-all duration-300"
        style="max-height: 0; overflow: hidden;"
      >
        <div id="chartRankingContainer" class="w-full" style="height: 400px; margin-bottom: 20px;">
          <canvas id="chartRanking"></canvas>
        </div>
        <div id="debugInfo" style="font-size: 12px; color: #666; margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: none;">
          <!-- Debug info will be inserted here -->
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ACCORDION 2: SKOR URGENSI PER SURAT     -->
    <!-- ========================================== -->
    <div class="border border-gray-300 rounded-lg overflow-hidden">
      <!-- HEADER ACCORDION 2 -->
      <button 
        onclick="toggleAccordion('accordion-2')" 
        class="w-full px-4 py-3 bg-gray-100 hover:bg-gray-200 flex justify-between items-center font-semibold text-gray-800 transition"
      >
        <span>Secara Nilai Preferensi</span>
        <span id="arrow-2" class="transition transform duration-300">›</span>
      </button>
      
      <!-- CONTENT ACCORDION 2 -->
      <div 
        id="accordion-2" 
        class="hidden bg-white p-4 overflow-hidden transition-all duration-300"
        style="max-height: 0; overflow: hidden;"
      >
        <div class="w-full" style="height: 400px; margin-bottom: 20px;">
          <canvas id="chartPreferensi"></canvas>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- ========================================== -->
<!-- SCRIPT: CHART.JS & ACCORDION LOGIC       -->
<!-- ========================================== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// ✅ DATA DARI DJANGO VIEW (JSON STRING)
let rankingLabels = [];
let rankingValues = [];
let rankingInfo = [];
let preferensiLabels = [];
let preferensiData = [];

// Parse data dengan error handling
try {
  const rawRankingLabels = '{{ ranking_labels|safe }}';
  const rawRankingValues = '{{ ranking_values|safe }}';
  const rawRankingInfo = '{{ ranking_info|safe }}';
  const rawPreferensiLabels = '{{ preferensi_labels|safe }}';
  const rawPreferensiData = '{{ preferensi_data|safe }}';
  
  console.log('[DEBUG] Raw data loaded');
  console.log('[DEBUG] rankingLabels:', rawRankingLabels.substring(0, 100));
  
  if (rawRankingLabels && rawRankingLabels !== '[]') {
    rankingLabels = JSON.parse(rawRankingLabels);
  }
  if (rawRankingValues && rawRankingValues !== '[]') {
    rankingValues = JSON.parse(rawRankingValues);
  }
  if (rawRankingInfo && rawRankingInfo !== '[]') {
    rankingInfo = JSON.parse(rawRankingInfo);
  }
  if (rawPreferensiLabels && rawPreferensiLabels !== '[]') {
    preferensiLabels = JSON.parse(rawPreferensiLabels);
  }
  if (rawPreferensiData && rawPreferensiData !== '[]') {
    preferensiData = JSON.parse(rawPreferensiData);
  }
  
  console.log('[DEBUG] Data parsed successfully');
  console.log('[DEBUG] rankingLabels count:', rankingLabels.length);
  console.log('[DEBUG] rankingValues count:', rankingValues.length);
  
} catch (e) {
  console.error('[ERROR] Failed to parse data:', e);
  document.getElementById('debugInfo').innerHTML = '<strong>Error parsing data:</strong> ' + e.message;
  document.getElementById('debugInfo').style.display = 'block';
}

// Global chart objects
let chartRanking = null;
let chartPreferensi = null;

// ========================================== 
// ACCORDION TOGGLE FUNCTION
// ========================================== 
function toggleAccordion(id) {
  const element = document.getElementById(id);
  const arrowId = 'arrow-' + id.split('-')[1];
  const arrow = document.getElementById(arrowId);
  
  const isHidden = element.classList.contains('hidden');
  
  if (isHidden) {
    // OPEN
    element.classList.remove('hidden');
    element.style.maxHeight = '600px';
    arrow.style.transform = 'rotate(90deg)';
    
    // Render chart
    if (id === 'accordion-1' && chartRanking === null) {
      setTimeout(renderChartRanking, 100);
    } else if (id === 'accordion-2' && chartPreferensi === null) {
      setTimeout(renderChartPreferensi, 100);
    }
  } else {
    // CLOSE
    element.style.maxHeight = '0';
    element.classList.add('hidden');
    arrow.style.transform = 'rotate(0deg)';
  }
}

// ========================================== 
// CHART 1: BAR CHART - PRIORITAS SURAT BERDASARKAN RANKING
// ========================================== 
function renderChartRanking() {
  console.log('[CHART] Rendering Chart 1 (Ranking)');
  console.log('[CHART] Data points:', rankingLabels.length);
  
  // Validasi data
  if (rankingLabels.length === 0 || rankingValues.length === 0) {
    console.error('[CHART] No data to render!');
    document.getElementById('debugInfo').innerHTML = '<strong>⚠️ No data available</strong><br>Check if there are any ranking results in the database.';
    document.getElementById('debugInfo').style.display = 'block';
    return;
  }
  
  if (rankingLabels.length !== rankingValues.length) {
    console.error('[CHART] Data mismatch!', rankingLabels.length, rankingValues.length);
  }
  
  const canvas = document.getElementById('chartRanking');
  if (!canvas) {
    console.error('[CHART] Canvas element not found!');
    return;
  }
  
  const ctx = canvas.getContext('2d');
  
  // Destroy existing chart
  if (chartRanking !== null) {
    chartRanking.destroy();
  }
  
  chartRanking = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: rankingLabels,
      datasets: [{
        label: 'Nilai Preferensi',
        data: rankingValues,
        backgroundColor: '#4CAF50',
        borderColor: '#2E7D32',
        borderWidth: 1,
        borderRadius: 4,
        hoverBackgroundColor: '#2E7D32',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'x',
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: {
            font: { size: 14 },
            padding: 15,
          }
        },
        title: {
          display: true,
          text: 'Prioritas Surat Berdasarkan Ranking',
          font: { size: 16, weight: 'bold' }
        },
        tooltip: {
          callbacks: {
            title: function(context) {
              const dataIndex = context[0].dataIndex;
              if (rankingInfo[dataIndex]) {
                return rankingInfo[dataIndex].no_surat;
              }
              return '';
            },
            label: function(context) {
              return 'Preferensi: ' + context.parsed.y.toFixed(3);
            }
          },
          padding: 10,
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          borderColor: '#4CAF50',
          borderWidth: 1,
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 1.0,
          ticks: {
            stepSize: 0.1,
            callback: function(value) {
              return value.toFixed(1);
            }
          },
          title: {
            display: true,
            text: 'Nilai Preferensi'
          }
        },
        x: {
          title: {
            display: true,
            text: 'Ranking'
          }
        }
      }
    }
  });
  
  console.log('[CHART] Chart 1 rendered successfully');
}

// ========================================== 
// CHART 2: LINE CHART - SKOR URGENSI PER SURAT
// ========================================== 
function renderChartPreferensi() {
  console.log('[CHART] Rendering Chart 2 (Preferensi)');
  
  if (preferensiLabels.length === 0 || preferensiData.length === 0) {
    console.error('[CHART] No preferensi data!');
    return;
  }
  
  const canvas = document.getElementById('chartPreferensi');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  
  if (chartPreferensi !== null) {
    chartPreferensi.destroy();
  }
  
  chartPreferensi = new Chart(ctx, {
    type: 'line',
    data: {
      labels: preferensiLabels,
      datasets: [{
        label: 'Nilai Preferensi',
        data: preferensiData,
        borderColor: '#4CAF50',
        backgroundColor: 'rgba(76, 175, 80, 0.1)',
        borderWidth: 2.5,
        fill: true,
        tension: 0.4,
        pointRadius: 5,
        pointBackgroundColor: '#4CAF50',
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        pointHoverRadius: 7,
        pointHoverBackgroundColor: '#2E7D32',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: {
            font: { size: 14 },
            padding: 15,
          }
        },
        title: {
          display: true,
          text: 'Skor Urgensi per Surat (Nilai Preferensi)',
          font: { size: 16, weight: 'bold' }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return 'Nilai: ' + context.parsed.y.toFixed(3);
            }
          },
          padding: 10,
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          borderColor: '#4CAF50',
          borderWidth: 1,
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 1.0,
          ticks: {
            stepSize: 0.1,
            callback: function(value) {
              return value.toFixed(1);
            }
          },
          title: {
            display: true,
            text: 'Nilai Preferensi (0 - 1)'
          }
        },
        x: {
          title: {
            display: true,
            text: 'Nomor Surat'
          },
          ticks: {
            maxRotation: 45,
            minRotation: 0,
          }
        }
      }
    }
  });
  
  console.log('[CHART] Chart 2 rendered successfully');
}

// Log untuk verifikasi
console.log('[INIT] Chart initialization complete');
console.log('[INIT] Data summary:');
console.log('[INIT] - Ranking data: ' + rankingLabels.length + ' items');
console.log('[INIT] - Preferensi data: ' + preferensiLabels.length + ' items');
</script>

{% endblock %}
