{% extends 'base.html' %}

{% block content %}
<div class="bg-white shadow-lg rounded-lg p-6">
        
    <div class="flex justify-between space-x-2 mb-4">
        <h2 class="text-xl font-bold mb-4">Tambah Disposisi untuk {{ surat.no_surat }}</h2>
    </div>
    <div class="bg-white shadow rounded p-6 space-y-4">
        <form method="post" class="space-y-4 justify-center">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-6 flex justify-center">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded justify-center items-center">Simpan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
