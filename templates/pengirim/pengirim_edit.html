{% extends 'base.html' %}

{% block content %}

<div class="bg-white shadow rounded p-6 space-y-4">
    <h1 class="text-xl font-bold mb-4">Edit Pengirim</h1>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_nama" class="block font-semibold">Pengirim</label>
            {{ form.nama }}
            {{ form.nama.errors }}
        </div>
       <div class="flex justify-center space-x-2 mt-4">
            <a href="{% url 'pengirim_index' %}" class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 text-white rounded">Kembali</a>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Simpan</button>
        </div>

    </form>

     {% if messages %}
    {% for message in messages %}
      <div class="mt-4 px-4 py-2 rounded 
                  {% if message.tags == 'success' %} bg-green-100 border border-green-400 text-green-700 
                  {% elif message.tags == 'error' %} bg-red-100 border border-red-400 text-red-700 
                  {% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

    <!-- Preview data lama -->
    <table class="w-full border border-gray-300 border-collapse">
        <thead class="bg-yellow-100 text-center">
            <tr>
                <th class="text-center py-2 px-4">#</th>
                <th class="text-center py-2 px-4">Pengirim Lama</th>
            </tr>
        </thead>
        <tbody class="text-center">
            <tr>
                <td class="text-center py-2 px-4">1</td>
                <td class="text-center py-2 px-4">{{ pengirim.nama }}</td>
            </tr>
        </tbody>
    </table>
</div>

{% endblock %}
