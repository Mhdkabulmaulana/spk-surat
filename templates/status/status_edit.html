{% extends 'base.html' %}

{% block content %}
<!-- <h2 class="text-xl font-bold mb-4">{{ judul }}</h2> -->

<div class="bg-white shadow rounded p-6 space-y-4">
    <div class="flex justify-between space-x-2 mb-4">
    <h2 class="text-2xl font-bold text-black">Edit Status</h2>
    </div>
    <form method="post" class="space-y-4">
        {% csrf_token %}

        <!-- form -->
        <div>
            <label for="nama" class="block font-semibold mb-2">Nama</label>
            <input type="text" id="nama" name="nama" value="{{ statuses.nama }}" class="border rounded p-2 w-full">
        </div>

        <div class="flex justify-center space-x-2 mt-4">
            <a href="{% url 'status_index' %}" class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 text-white rounded">Kembali</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan</button>
        </div>

    </form>

    {% if pesan %}
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded">
        {{ pesan }}
    </div>
    {% endif %}

    <!-- Preview data lama -->
    <table class="w-full border border-gray-300 border-collapse">
        <thead class="bg-yellow-100 text-center">
            <tr>
                <th class="text-center py-2 px-4">#</th>
                <th class="text-center py-2 px-4">Nama</th>
            </tr>
        </thead>
        <tbody class="text-center">
            <tr>
                <td class="text-center py-2 px-4">1</td>
                <td class="text-center py-2 px-4">{{ statuses.nama }}</td>
            </tr>
        </tbody>
    </table>
</div>

{% endblock %}
